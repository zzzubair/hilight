name: release-asset

# Attaches hilight-axi.tgz to a release created by hand (`gh release create vX.Y.Z`), or to
# any existing tag on demand. Releases that release-please creates get the asset from
# release-please.yml, because a release made with GITHUB_TOKEN does not trigger this workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach hilight-axi.tgz to
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run pack:release

      - run: gh release upload "$TAG" hilight-axi.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
